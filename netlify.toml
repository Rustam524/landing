# Боевой сайт algoritm.top — одностраничник.
# Production branch в Netlify: main
# Черновик многостраничника: ветка cursor/multipage-homepage-draft-f437
# (её нельзя ставить как Production).

[build]
  publish = "."
  command = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

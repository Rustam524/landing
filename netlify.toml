[build]
  publish = "."
  functions = "netlify/functions"
  # При каждом деплое (в том числе после сохранения в /admin через Decap CMS)
  # пересобираем /content в готовые данные и статические страницы блога —
  # см. scripts/build-content.js.
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Тестовые заглушки закрываются от индексации через meta noindex в самих
# страницах (см. каждую страницу в /uslugi, /obuchenie, /blog и т.д.).
# На проде noindex не устанавливается — см. index.html.

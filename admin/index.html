<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Панель управления сайтом ALGORITM</title>
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
</head>
<body>
  <!--
    Decap CMS (бывший Netlify CMS) — бесплатная админ-панель.
    Ничего не публикуется в обход Git: каждое сохранение здесь — это
    обычный коммит в репозиторий, после которого Netlify сам пересобирает
    и обновляет сайт (см. netlify.toml).

    Настройка входа (один раз для владельца сайта):
      1. В Netlify: Site configuration → Identity → Enable Identity.
      2. Там же: Identity → Registration → Invite only (рекомендуется).
      3. Identity → Services → Git Gateway → Enable Git Gateway.
      4. Site configuration → Identity → Invite users → пригласить
         рабочий e-mail владельца сайта.
    После этого можно открывать /admin и входить по ссылке из письма.
  -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
